# ============================================================
# 发票管理系统 - Docker Compose 生产部署
#
# 启动:  docker compose up -d
# 停止:  docker compose down
# 日志:  docker compose logs -f invoice-app
# 更新:  docker compose build --no-cache && docker compose up -d
# ============================================================

version: "3.8"

services:
  # -------------------- FastAPI 后端 + 前端 SPA --------------------
  invoice-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: invoice-app
    restart: unless-stopped

    # 持久化数据（数据库、上传文件）
    volumes:
      - invoice-data:/app/data

    # 环境变量
    env_file:
      - .env.production

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 不对外暴露端口，仅通过 nginx 访问
    expose:
      - "8000"

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 256M
          cpus: "0.5"

  # -------------------- Nginx 反向代理 --------------------
  nginx:
    image: nginx:alpine
    container_name: invoice-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # 等 SSL 配置好再开启

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      invoice-app:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"

# 数据卷（数据库 + 上传文件持久化）
volumes:
  invoice-data:
    driver: local
    name: invoice-data
