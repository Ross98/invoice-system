# ============================================================
# 发票管理系统 - Nginx 反向代理配置
# 用法: 复制到 /etc/nginx/sites-available/invoice-system 后软链接启用
#   ln -s /etc/nginx/sites-available/invoice-system /etc/nginx/sites-enabled/
#   nginx -t && nginx -s reload
#
# 容器部署: docker-compose.yml 自动挂载此文件
# ============================================================

upstream invoice_backend {
    # Docker 容器名 / 或 server IP:PORT
    server invoice-app:8000;
    # 非 Docker 部署改为:
    # server 127.0.0.1:8000;

    keepalive 32;
}

# HTTP (先跑通 HTTP，之后再加 SSL)
server {
    listen 80;
    server_name _;  # 替换为你的域名，如 invoice.your-domain.com

    # 允许上传最大 10MB
    client_max_body_size 10m;

    # 访问日志
    access_log /var/log/nginx/invoice-access.log;
    error_log  /var/log/nginx/invoice-error.log;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API 反向代理
    location /api/ {
        proxy_pass http://invoice_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API 文档
    location /docs {
        proxy_pass http://invoice_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /redoc {
        proxy_pass http://invoice_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://invoice_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location /health {
        proxy_pass http://invoice_backend;
        proxy_set_header Host $host;
    }

    # 上传文件（图片/PDF 通过后端静态文件服务）
    location /uploads/ {
        proxy_pass http://invoice_backend;
        proxy_set_header Host $host;
    }

    # 前端 SPA — 直接代理到 FastAPI 的 SPA 中间件
    # （FastAPI 内置了前端静态文件服务和 SPA fallback）
    location / {
        proxy_pass http://invoice_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

